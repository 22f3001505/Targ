services:
  - type: web
    name: targ-api
    runtime: docker
    dockerfilePath: ./FastAPI_Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: targ-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://targ-web.onrender.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"

  - type: web
    name: targ-web
    runtime: docker
    dockerfilePath: ./Streamlit_Frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    plan: free
    envVars:
      - key: TARG_API_URL
        value: "https://targ-api.onrender.com"

databases:
  - name: targ-postgres
    databaseName: targ
    user: targ
    plan: free
